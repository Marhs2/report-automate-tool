<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 글꼴 CSS는 첫 화면을 막지 않게 뒤에서 붙인다(글자는 시스템 글꼴로 먼저 보인다).
         Pretendard는 굵기당 750KB 통파일 대신 화면에 쓴 글자 구간만 받는 동적 서브셋을 쓴다. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
    </noscript>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#edf1f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f171c" media="(prefers-color-scheme: dark)" />
    <!-- 첫 그림 전에 테마를 정한다. 늦게 정하면 다크 사용자가 흰 화면을 한 번 본다. 규칙은 src/composables/useTheme.js와 같다. -->
    <script>
      (function () {
        var saved = localStorage.getItem("report-theme");
        var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>일일보고</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
